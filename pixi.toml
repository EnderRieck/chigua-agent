[workspace]
channels = ["conda-forge"]
name = "吃瓜智能体"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
chigua = "python -m chigua"
ask = "python -m chigua ask"
hot = "python -m chigua hot"
doctor = "python -m chigua doctor"
test = "python -m pytest -q tests"
xhs-login = "python scripts/xhs_login.py"

[dependencies]
python = ">=3.11,<3.13"
httpx = ">=0.28.1,<0.29"
rich = ">=15.0.0,<16"
python-dotenv = ">=1.2.4,<2"
openai = ">=3.39.0,<4"
pydantic = ">=2.14.1,<3"
pytest = ">=9.1.1,<10"
prompt-toolkit = ">=3.0.53,<4"

[pypi-dependencies]
mcp = ">=1.2"
